<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soldagem e corte: guia visual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}
:root{--bg:#EDF0F3;--sf:#fff;--ink:#121A22;--mu:#53606C;--ln:#CBD3DB;--on:#fff;--ok:#2B8A3E;--no:#C92A2A;--a0:#33414E;--a1:#C2410C;--a2:#5F3DC4;--a3:#0B7285;--a4:#BE2A2A;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151A;--sf:#1A2128;--ink:#E8EDF1;--mu:#9AA8B4;--ln:#2C3740;--on:#10151A;--ok:#51CF66;--no:#FF6B6B;--a0:#B8C4CE;--a1:#FF8A4C;--a2:#A592F2;--a3:#3BC0D6;--a4:#FF7B7B;color-scheme:dark}}
:root[data-theme=dark]{--bg:#10151A;--sf:#1A2128;--ink:#E8EDF1;--mu:#9AA8B4;--ln:#2C3740;--on:#10151A;--ok:#51CF66;--no:#FF6B6B;--a0:#B8C4CE;--a1:#FF8A4C;--a2:#A592F2;--a3:#3BC0D6;--a4:#FF7B7B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Barlow,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:12px 20px 0}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;line-height:1.1;margin:0}
h1{font-size:1.9rem}
#nv{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
#nv button{flex:none;font:600 1rem Barlow,system-ui,sans-serif;color:var(--mu);background:none;border:0;border-bottom:4px solid transparent;padding:10px 14px;cursor:pointer}
#nv button[aria-current]{color:var(--ink);border-bottom-color:var(--c)}
main{max-width:1000px;margin:0 auto;padding:8px 20px 48px}
h2{font-size:2.6rem;margin:24px 0 8px;border-left:8px solid var(--c);padding-left:14px}
.in{font-size:1.25rem;margin:0 0 8px;max-width:60ch}
.blk{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:18px;margin:18px 0}
h3{font-size:1.4rem;margin-bottom:12px}
button{font:inherit;color:inherit}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--c,var(--a0));outline-offset:2px}
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px}
.ls{display:flex;flex-direction:column;gap:6px}
.ls button,.q button{text-align:left;padding:10px 12px;border:1px solid var(--ln);background:none;border-radius:8px;cursor:pointer}
[aria-pressed=true]{background:var(--c);color:var(--on)!important;border-color:var(--c)!important}
.pn{border-left:4px solid var(--c);padding:2px 0 2px 16px;font-size:1.15rem}
.pn b{display:block;font-size:1.5rem;font-family:'Barlow Condensed',sans-serif;margin-bottom:2px}
.pn span{display:block}
.pn .xt{margin-top:8px;color:var(--mu)}
.i *{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.i text{stroke:none;fill:currentColor;font:600 11px Barlow,sans-serif;text-anchor:middle}.i .f{fill:currentColor}.ls button{display:flex;align-items:center;gap:10px}.ls .i{width:32px;height:32px;flex:none}.pn .ico{width:120px;height:120px;color:var(--c);margin-bottom:8px}.sc3{width:100%;max-height:280px;display:block;margin-bottom:14px;background:var(--bg);border-radius:8px}.sc3 *{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.sc3 text{stroke:none;fill:var(--ink);font:600 12px Barlow,sans-serif}.sc3 .f{fill:var(--ink)}.sc3 [data-s]{opacity:.12}.sc3 [data-s].c,.sc3 [data-s].p{opacity:1}.sc3 .c *{stroke:var(--c)}.sc3 .c .f{fill:var(--c)}.sc3 .c text{stroke:none;fill:var(--c)}.sc3 [data-s].h{opacity:0}.hero{width:100%;max-height:220px;display:block;margin:14px 0;background:var(--sf);border:1px solid var(--ln);border-radius:10px}.hero *{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.hero .a{stroke:var(--c)}.hero .f{fill:var(--c);stroke:none}.hero text{stroke:none;fill:var(--ink);font:600 12px Barlow,sans-serif}@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.fi{animation:fi .35s ease}#nv button{transition:color .2s,border-color .2s}@media(prefers-reduced-motion:reduce){.fi{animation:none}#nv button{transition:none}}.sn{display:flex;gap:8px;margin-bottom:14px}
.sn button{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln);background:none;font-weight:600;cursor:pointer}
.sn button.dn{border-color:var(--c)}
.sc{display:flex;gap:8px;margin-top:14px}
.sc button{padding:8px 16px;border:1px solid var(--ln);border-radius:8px;background:none;cursor:pointer}
.sc button:disabled{opacity:.4;cursor:default}
input[type=range]{width:100%;accent-color:var(--c);margin:8px 0 0}
.lb{display:flex;justify-content:space-between;font-weight:600;margin:0 0 14px;color:var(--mu)}
details{border-top:1px solid var(--ln);padding:10px 0}
details:last-child{border-bottom:1px solid var(--ln)}
summary{cursor:pointer;font-weight:600;font-size:1.1rem}
details p{margin:6px 0 0;border-left:4px solid var(--c);padding-left:12px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pc h4{margin:0 0 6px;font-size:1.1rem;color:var(--c)}
.pc ul{margin:0;padding-left:20px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:1rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
th{color:var(--c)}
.q{display:flex;flex-direction:column;gap:8px}
.q button.ok{background:var(--ok);color:var(--on);border-color:var(--ok)}
.q button.no{background:var(--no);color:var(--on);border-color:var(--no)}
.fb{margin:10px 0 0;font-weight:600}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.cd{text-align:left;background:var(--sf);border:1px solid var(--ln);border-left:8px solid var(--c);border-radius:10px;padding:16px;cursor:pointer;font-size:1rem}
.cd h4{margin:0 0 6px;font:700 1.5rem 'Barlow Condensed',sans-serif;color:var(--c)}
.cd p{margin:4px 0}
.gt{font-size:1.3rem;margin:26px 0 12px}
@media(max-width:640px){.ex,.pc{grid-template-columns:1fr}h2{font-size:2rem}}
</style>
</head>
<body>
<header><h1>Soldagem e corte: guia visual</h1><nav id="nv" aria-label="Temas"></nav></header>
<main id="m"></main>
<script>
const T=[
{id:'ox',n:'Oxiacetilênica',c:1,t:'Soldagem oxiacetilênica',i:'Uma chama de acetileno com oxigênio (até ~3.100 °C) derrete as bordas das peças. Ao esfriar, o metal forma a união.',o:[
{y:'st',t:'Como funciona',i:[['Gases saem dos cilindros','Oxigênio e acetileno seguem por mangueiras até o maçarico.'],['Mistura e chama','No maçarico os gases se misturam e são acesos. O operador ajusta a proporção para mudar o tipo de chama.'],['Fusão','A chama derrete as bordas. Se faltar material, usa-se uma vareta de adição.'],['Resfriamento','O metal esfria e solidifica: a junta está pronta.']]},
{y:'ex',t:'Equipamentos',i:[['Cilindros','Um de oxigênio e outro de acetileno.'],['Reguladores','Ficam nos cilindros e controlam a pressão dos gases.'],['Mangueiras','Levam cada gás até o maçarico. Uma para cada gás, sem vazamentos.'],['Maçarico','Mistura os gases e produz a chama. O bico é escolhido pela espessura da peça.'],['Anti-retrocesso','Impede que a chama volte pelas mangueiras para o equipamento.'],['EPIs','Óculos com filtro, luvas, avental e calçado de segurança.']]},
{y:'ex',t:'Consumíveis',i:[['Oxigênio','Faz o acetileno queimar com mais intensidade.'],['Acetileno','Gás combustível: ao queimar, libera o calor que derrete o metal.'],['Vareta de adição','Preenche o espaço entre as peças. Precisa ser compatível com o metal.'],['Fluxo','Controla óxidos em alguns casos (ex.: cobre). Nem toda solda usa.']]},
{y:'pc',t:'Onde usar',a:['Serve para',['Oficinas, serralherias e manutenção','Reparo de tubos, chapas finas e peças pequenas','Aço-carbono, baixa liga e cobre','Locais sem energia elétrica','Também aquece peças e faz brasagem (une sem derreter o metal base)']],b:['Limita',['Mais lenta que outros processos','Calor prolongado: risco de deformação e de alterar o material perto da solda','Ruim para peças muito espessas','Não serve para produção em grande escala']]},
{y:'rk',t:'Riscos e segurança',i:[['Incêndio e explosão','Cilindros na vertical e bem fixos; checar mangueiras e conexões; afastar materiais inflamáveis.'],['Queimaduras','Luvas, avental e calçado de segurança.'],['Lesão nos olhos','Óculos com filtro adequado.'],['Retrocesso de chama','Usar dispositivo anti-retrocesso.'],['Fumaça e gases','Trabalhar em ambiente ventilado.'],['Óleo ou graxa','Nunca usar em equipamento de oxigênio: reação perigosa.']]},
{y:'tb',t:'Normas',h:['Norma','Trata de'],r:[['ISO 5175-1:2017','Dispositivos de segurança em solda a gás, incluindo retrocesso de chama'],['NR-1','Gerenciamento de riscos ocupacionais'],['NR-6','EPIs'],['NR-20','Inflamáveis e combustíveis'],['NR-23','Proteção contra incêndios'],['NR-26','Sinalização de segurança']]},
{y:'qz',t:'Teste rápido',q:'Qual gás é o combustível da chama?',o:['Oxigênio','Acetileno','Argônio'],a:1,e:'O oxigênio só faz o acetileno queimar com mais intensidade.'}]},
{id:'pl',n:'Plasma',c:2,t:'Corte a plasma manual',i:'Um jato de gás ionizado (~20.000 °C) funde o metal e o expulsa, abrindo o corte (kerf). Só corta metais condutores.',o:[
{y:'st',t:'Formação do arco',i:[['Vórtice','O gás passa pelo swirl ring e gira. Isso aperta e estabiliza o arco.'],['Arco piloto','Abre entre eletrodo e bocal, por alta frequência ou contato, e ioniza o gás.'],['Arco transferido','O arco salta para a peça. A corrente volta à máquina pela garra de retorno.'],['Corte','O calor funde o metal e o jato expulsa o material, formando o kerf.']]},
{y:'ex',t:'Equipamentos',i:[['Fonte','Converte alta tensão e baixa corrente em baixa tensão e alta corrente.'],['Gás','Compressor com filtro e secador, ou cilindro com regulador. O gás deve ser limpo e seco.'],['Tocha com cabo','Leva o gás e o arco até a peça.'],['Garra de retorno','Fecha o circuito elétrico. Precisa de contato limpo e firme.']]},
{y:'ex',t:'Consumíveis da tocha (troque eletrodo e bocal juntos)',i:[['Eletrodo','Conduz a corrente; tem inserto de háfnio.','Desgaste: cratera na ponta (troca em ~0,8 a 1 mm; vale o manual do fabricante).'],['Bocal','Aperta e direciona o arco. Define a qualidade do corte.','Desgaste: orifício alargado ou oval; óxido.'],['Swirl ring','Faz o gás girar e isola o eletrodo do bocal.','Desgaste: rachaduras, queima ou isolante danificado.'],['Escudo','Protege o bocal e orienta o gás.','Desgaste: orifício queimado ou torto; escória acumulada.'],['Capa de retenção','Mantém bocal e swirl ring no lugar.','Desgaste: dano físico ou folga.']]},
{y:'ex',t:'Qual gás usar?',i:[['Ar','Aço, inox e alumínio. Barato e versátil; o mais comum em tocha manual.','Pode formar nitretos na borda.'],['Oxigênio','Aço-carbono: corte limpo e rápido.','Evitar em inox e alumínio.'],['Nitrogênio','Inox e alumínio. Dá a melhor vida útil das peças.'],['Argônio + hidrogênio','Plasma mais quente, para inox e alumínio grossos.','Não serve para aço-carbono.']]},
{y:'sl',t:'Velocidade de corte e qualidade',i:[['Baixa','Escória volumosa e bolhosa na face inferior.'],['Ideal','Borda lisa, pouca inclinação (bevel) e sem escória.'],['Alta','Escória dura, difícil de remover.']]},
{y:'ex',t:'Defeitos da borda (se pioram, troque os consumíveis)',i:[['Bevel','Borda inclinada, fora de esquadro.'],['Escória (dross)','Metal solidificado na face inferior do corte.'],['Estrias','Marcas inclinadas deixadas pelo arco na face cortada.'],['Kerf','Largura do canal removido. Aumenta com bocal gasto.'],['Nitretos','Corte com ar deixa uma camada de nitretos. Antes de soldar, esmerilhe a borda.']]},
{y:'pc',t:'Onde usar',a:['Serve para',['Aço-carbono, inox, alumínio e cobre','ISO 9013: de 0,5 a 150 mm (depende da corrente)','Cortar chapa e perfil, remover peças, goivagem','Portátil e de custo menor que o laser']],b:['Limita',['Não corta isolantes','Bevel, escória e zona afetada pelo calor','Fumos, ruído e radiação intensos','Laser é melhor em chapa fina e furos; oxicorte vai a espessuras maiores']]},
{y:'rk',t:'Riscos e segurança',i:[['Choque elétrico','Luvas e área secas; cabos e tocha íntegros; não remover a trava; desligar antes de trocar consumíveis.'],['Radiação do arco','Lente com sombra adequada à corrente (manual do fabricante e Z49.1).'],['Fumos e ozônio','Exaustão local; remover tinta e galvanização antes do corte.'],['Ruído (acima de 80 dB)','Protetor auricular.'],['Incêndio e queimaduras','Afastar combustíveis; luvas de raspa, avental e calçado fechado.'],['Marca-passo','O circuito pode interferir. Consultar o médico.']]},
{y:'tb',t:'Normas técnicas (confirmar a versão vigente)',h:['Norma','Trata de'],r:[['ISO 9013:2017 + Amd 1:2024','Classificação e tolerâncias de cortes térmicos. Só vale se citada no desenho'],['IEC 60974-1 / ABNT NBR IEC 60974-1','Segurança e desempenho das fontes'],['ABNT NBR IEC 60974-7','Segurança e construção de tochas'],['ABNT NBR 14250','Reguladores de pressão para cilindros'],['ANSI Z49.1:2021','Segurança, ventilação e prevenção de incêndio']]},
{y:'tb',t:'Normas Regulamentadoras',h:['NR','Trata de'],r:[['NR-1','Gerenciamento de riscos e treinamento'],['NR-6','EPIs'],['NR-9','Exposição a fumos, ruído e radiação'],['NR-10','Instalações e serviços elétricos'],['NR-12','Segurança de máquinas'],['NR-15','Atividades insalubres'],['NR-23','Prevenção de incêndios'],['NR-26','Sinalização de segurança']]},
{y:'qz',t:'Teste rápido',q:'O que o swirl ring faz?',o:['Isola o eletrodo e gira o gás','Fecha o circuito elétrico','Protege o bocal de respingos'],a:0,e:'A garra de retorno fecha o circuito; o escudo protege o bocal.'}]},
{id:'ar',n:'Solda a arco',c:3,t:'Solda a arco: recuperar um eixo',i:'Caso: eixo de aço-carbono de um torno, com desgaste no apoio. É preciso escolher o consumível, dar o acabamento certo e conferir as medidas.',o:[
{y:'ex',t:'Consumíveis',i:[['Eletrodo revestido','Processo SMAW. Dá o arco e o metal de adição; o revestimento protege a poça.','Para aço-carbono: E6013 ou E7018. O E7018 exige controle de umidade.'],['Arame','Processo MIG/MAG. Metal de adição contínuo.','Exemplo: ER70S-6.'],['Gás de proteção','No MAG, CO₂ ou argônio + CO₂ protegem o metal fundido do ar.'],['Abrasivos','Discos de desbaste e corte e lixas: preparam a superfície e fazem o acabamento.']]},
{y:'ex',t:'Como escolher',i:[['Compatibilidade química','Metal de adição compatível com o aço do eixo.'],['Resistência','O depósito aguenta contato, atrito e carga no apoio.'],['Soldabilidade','Considerar o teor de carbono, a espessura e o risco de trincas.'],['Parâmetros','Corrente, tensão, polaridade e velocidade seguem o procedimento qualificado.'],['Armazenamento','Seguir o fabricante. Eletrodos de baixo hidrogênio pedem controle de umidade.']]},
{y:'ex',t:'Defeitos (causam vibração, desalinhamento e menos vida útil)',i:[['Porosidade','Cavidades por gás, contaminação ou proteção ruim.'],['Falta de fusão','O metal depositado não liga ao metal base.'],['Trincas','Podem crescer sob esforço.'],['Inclusões de escória','Resíduos presos reduzem a integridade da junta.'],['Deformação térmica','Aquecimento e resfriamento desiguais mudam a geometria.'],['Desgaste prematuro','Superfície com dureza ou acabamento inadequados perde material rápido.']]},
{y:'ex',t:'Ferramentas de acabamento',i:[['Esmerilhadeira','Remove excesso de metal, respingos e irregularidades. Cuidado com remoção demais e aquecimento local.'],['Escova de aço','Tira resíduos da superfície.'],['Martelo ou picadeira','Retira a escória do revestimento do eletrodo.'],['Torno mecânico','Usina a região recuperada: diâmetro, concentricidade e acabamento do apoio.']]},
{y:'st',t:'Sequência de recuperação',i:[['Inspeção inicial','Medir o diâmetro, achar a extensão do desgaste e procurar trincas.'],['Preparar a superfície','Remover óleo, graxa, oxidação e material deteriorado.'],['Controlar o calor','Parâmetros certos; pré-aquecimento e temperatura entre passes quando preciso.'],['Depositar','Aplicar o metal de forma uniforme, sem excesso e sem concentrar calor.'],['Resfriar','Seguir o procedimento para evitar trincas.'],['Usinar','No torno, restabelecer diâmetro, concentricidade e acabamento.'],['Inspeção final','Micrômetro e paquímetro; inspeção visual ou ensaio não destrutivo. Só então liberar o eixo.']]},
{y:'tb',t:'Acabamento: junta soldada x borda cortada',h:['','Junta soldada','Borda cortada'],r:[['Objetivo','Eliminar irregularidades e garantir a qualidade da união','Eliminar rebarbas e imperfeições do corte'],['Remover','Escória, respingos, excesso de reforço','Rebarbas, arestas vivas, escória de corte'],['Ferramentas','Esmerilhadeira, escova de aço, limas','Limas, rebarbadores, lixas, esmerilhadeira'],['Controle','Inspeção visual, descontinuidades, dimensões','Geometria, perpendicularidade, ausência de rebarbas']]},
{y:'qz',t:'Teste rápido',q:'Por que o eletrodo E7018 exige cuidado?',o:['Precisa de controle de umidade','Só funciona em MIG','Não gera escória'],a:0,e:'É um eletrodo de baixo hidrogênio: umidade prejudica a solda.'}]},
{id:'oc',n:'Oxicorte',c:4,t:'Oxicorte manual com maçarico',i:'Uma chama aquece o aço e um jato de oxigênio o queima. O óxido formado é mais fraco que o aço e é lançado para fora.',o:[
{y:'st',t:'Como corta',i:[['Pré-aquecimento','A chama aquece a área de corte.'],['Jato de oxigênio','Um jato concentrado atinge a área aquecida e oxida o metal.'],['Escória','O aço oxidado tem menos resistência e vira escória.'],['Abertura do corte','A força do mesmo jato lança a escória para fora.']]},
{y:'ex',t:'Equipamentos',i:[['Cilindro de oxigênio','Fonte do oxigênio concentrado do jato de corte.'],['Cilindro de combustível','Gás da chama de pré-aquecimento, como propano ou butano.'],['Reguladores','Um para cada gás: garantem a pressão certa.'],['Mangueiras','Levam o gás da fonte até o maçarico.'],['Maçarico','Libera a chama e o jato de oxigênio.']]},
{y:'sl',t:'Espessura da chapa',i:[['Fina','A chama de pré-aquecimento deforma a chapa antes do corte começar.'],['Média (10 a 50 mm)','A melhor faixa: boa qualidade e bom acabamento.'],['Grossa','Exige mais esforço. Instabilidade causa rebarbas e o acabamento fica mais difícil. O oxicorte chega a ~300 mm.']]},
{y:'ex',t:'Escória e acabamento',i:[['Escória','É o aço oxidado, lançado pelo jato. Precisa ser coletada depois.'],['Acabamento','Costuma exigir trabalho posterior. Técnicas específicas pedem operadores mais capacitados.']]},
{y:'pc',t:'Onde usar',a:['Serve para',['Aço-carbono e aço de baixa liga','Chapas médias e grossas','Corte em máquinas CNC, combinável com plasma','Reparo de campo e construção civil: pouco equipamento e sem energia elétrica estável']],b:['Limita',['Não corta inox nem alumínio (use plasma)','Chapa fina deforma com o pré-aquecimento','Escória e acabamento posterior','Gases e altas temperaturas']]},
{y:'rk',t:'Riscos e segurança',i:[['Gases e oxigênio concentrado','Conhecer o processo e o equipamento; fazer manutenção frequente.'],['Calor e escória quente','EPIs e EPCs da soldagem tradicional, mais os cuidados com oxigênio concentrado.'],['Contato indevido','Impedir que a tocha e a escória toquem qualquer coisa além da peça.']]},
{y:'qz',t:'Teste rápido',q:'Qual metal o oxicorte corta bem?',o:['Aço-carbono e baixa liga','Alumínio','Plástico'],a:0,e:'O óxido do aço é mais fraco e sai com o jato. Para inox e alumínio, use plasma.'}]}
,{id:'br',n:'Briefing',c:0,t:'Briefing: conjunto metálico de aço-carbono',i:'Recomendação técnica: soldagem oxiacetilênica para fabricar um conjunto metálico de aço-carbono.',o:[
